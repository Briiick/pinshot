<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' file: data:; style-src 'self' 'unsafe-inline'">
  <title>PinShot History</title>
  <link rel="stylesheet" href="prefs.css">
  <link rel="stylesheet" href="history.css">
</head>
<body>
  <header>
    <h1>Capture History</h1>
    <div class="segmented" id="filter">
      <button data-filter="all" class="on">All</button>
      <button data-filter="image">Screenshots</button>
      <button data-filter="video">Recordings</button>
    </div>
    <span class="spacer"></span>
    <button id="open-folder">Open Save Folder</button>
    <button id="clear">Clear…</button>
  </header>
  <main id="list"></main>
  <div id="empty" hidden>
    <svg viewBox="0 0 24 24"><path d="M4 7h3l2-2h6l2 2h3v12H4zM12 10a3.5 3.5 0 100 7 3.5 3.5 0 000-7z"/></svg>
    <p>Your screenshots and recordings show up here.</p>
    <p class="muted">Drag a thumbnail out of the corner into any app and it moves here.</p>
  </div>
  <template id="card">
    <figure class="card" tabindex="0" draggable="true">
      <div class="shot"><img alt="" draggable="false"><span class="badge" hidden></span>
        <div class="actions">
          <button data-action="copy" class="image-only" title="Copy (⌘C)">Copy</button>
          <button data-action="pin" class="image-only" title="Pin to screen">Pin</button>
          <button data-action="edit" class="image-only" title="Annotate">Annotate</button>
          <button data-action="open" class="video-only" title="Play">Play</button>
          <button data-action="reveal" title="Show in folder">Show</button>
          <button data-action="delete" class="danger" title="Remove from history (Delete)">✕</button>
        </div>
      </div>
      <figcaption><span class="time"></span><span class="size"></span></figcaption>
    </figure>
  </template>
  <script src="history.js"></script>
</body>
</html>
