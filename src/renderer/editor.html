<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'">
  <title>PinShot — Annotate</title>
  <link rel="stylesheet" href="editor.css">
</head>
<body>
  <header id="toolbar">
    <div class="group" id="tools">
      <button data-tool="select" title="Select & move (V)"><svg viewBox="0 0 24 24"><path d="M5 3l14 8-6 1.5L10 19z"/></svg></button>
      <button data-tool="arrow" title="Arrow (A)"><svg viewBox="0 0 24 24"><path d="M5 19L18 6M10 6h8v8" class="stroke"/></svg></button>
      <button data-tool="rect" title="Rectangle (R)"><svg viewBox="0 0 24 24"><rect x="4" y="6" width="16" height="12" rx="1.5" class="stroke"/></svg></button>
      <button data-tool="ellipse" title="Ellipse (O)"><svg viewBox="0 0 24 24"><ellipse cx="12" cy="12" rx="8.5" ry="6.5" class="stroke"/></svg></button>
      <button data-tool="line" title="Line (L)"><svg viewBox="0 0 24 24"><path d="M5 19L19 5" class="stroke"/></svg></button>
      <button data-tool="pen" title="Pen (P)"><svg viewBox="0 0 24 24"><path d="M4 17c3-6 5 2 8-3s4-6 8-7" class="stroke"/></svg></button>
      <button data-tool="highlighter" title="Highlighter (H)"><svg viewBox="0 0 24 24"><path d="M4 15h16" class="stroke wide"/></svg></button>
      <button data-tool="text" title="Text (T)"><svg viewBox="0 0 24 24"><path d="M6 6h12M12 6v13" class="stroke"/></svg></button>
      <button data-tool="step" title="Numbered step (N)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><text x="12" y="16" text-anchor="middle" class="num">1</text></svg></button>
      <button data-tool="pixelate" title="Pixelate / redact (B)"><svg viewBox="0 0 24 24"><path d="M4 4h5v5H4zM15 4h5v5h-5zM9.5 9.5h5v5h-5zM4 15h5v5H4zM15 15h5v5h-5z"/></svg></button>
      <button data-tool="crop" title="Crop (C)"><svg viewBox="0 0 24 24"><path d="M7 3v14h14M3 7h14v14" class="stroke"/></svg></button>
    </div>
    <div class="sep"></div>
    <div class="group" id="colors"></div>
    <div class="sep"></div>
    <div class="group" id="sizes">
      <button data-size="1" title="Thin (1)"><span style="width:4px;height:4px"></span></button>
      <button data-size="2" title="Medium (2)"><span style="width:7px;height:7px"></span></button>
      <button data-size="3" title="Thick (3)"><span style="width:11px;height:11px"></span></button>
    </div>
    <div class="sep"></div>
    <div class="group">
      <button id="undo" title="Undo (⌘/Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5M4 9h10a6 6 0 010 12h-3" class="stroke"/></svg></button>
      <button id="redo" title="Redo (⇧⌘/Ctrl+Z)"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5M20 9H10a6 6 0 000 12h3" class="stroke"/></svg></button>
    </div>
    <div class="flex"></div>
    <div class="group actions">
      <button id="copy" class="text" title="Copy (⌘/Ctrl+C)">Copy</button>
      <button id="save" class="text" title="Save As… (⌘/Ctrl+S)">Save…</button>
      <button id="cancel" class="text" title="Discard changes (Esc)">Cancel</button>
      <button id="done" class="text primary" title="Apply to pin (⌘/Ctrl+Enter)">Done</button>
    </div>
  </header>
  <main id="stage">
    <div id="canvasWrap">
      <canvas id="canvas"></canvas>
      <textarea id="textEditor" spellcheck="false" hidden></textarea>
    </div>
  </main>
  <div id="cropBar" hidden>
    <span>Drag to choose the crop area</span>
    <button id="cropApply" class="text primary">Apply ⏎</button>
    <button id="cropCancel" class="text">Cancel</button>
  </div>
  <div id="toast" hidden></div>
  <script src="editor.js"></script>
</body>
</html>
